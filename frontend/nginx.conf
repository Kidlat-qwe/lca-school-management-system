server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache hashed Vite assets; never cache the shell HTML
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /favicon.ico {
        try_files /favicon.ico =404;
        access_log off;
        log_not_found off;
    }

    # SPA: all unknown paths serve index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
